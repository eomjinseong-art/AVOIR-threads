name: Threads 자동 발행

# 하루 2회: 오전(출근길) 슬롯 + 저녁(퇴근 후) 슬롯, KST.
# GitHub 크론은 정각 근처에 수십 분~몇 시간씩 밀리기 때문에 슬롯마다 여러 번 깨우고,
# 스크립트가 "이 슬롯에 이미 올렸는지"를 content/state.json 으로 확인해 슬롯당 1개만 올린다.
on:
  schedule:
    # 오전 슬롯: KST 07:47, 08:47, 09:17, 10:17 (UTC 22:47, 23:47, 00:17, 01:17)
    - cron: "47 22,23 * * *"
    - cron: "17 0,1 * * *"
    # 저녁 슬롯: KST 20:47, 21:47, 22:17, 23:17 (UTC 11:47, 12:47, 13:17, 14:17)
    - cron: "47 11,12 * * *"
    - cron: "17 13,14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post = 다음 글 1개 발행 / check = 토큰만 확인 (발행 안 함)"
        type: choice
        options: [check, post]
        default: check
      dry_run:
        description: "post 모드에서 실제 발행 없이 다음 글만 보기"
        type: boolean
        default: false

permissions:
  contents: write   # content/state.json 커밋
  issues: write     # 실패 알림 이슈

concurrency:
  group: threads-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -q -r scripts/requirements.txt

      - name: 발행 (토큰 확인 → 큐 → 시트 폴백)
        id: post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'post' }}
          # 수동 post 실행은 슬롯 제한 없이 1개 바로 발행
          FORCE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python scripts/post_to_threads.py

      - name: 발행 기록 커밋
        if: always()
        run: |
          git add content/state.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 발행 기록 갱신 [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
